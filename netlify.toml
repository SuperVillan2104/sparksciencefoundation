[build]
  publish = "app"

# Redirect default Netlify subdomain to custom domain
[[redirects]]
  from = "https://sparksciencefoundation.netlify.app/*"
  to = "https://sparksciencefoundation.in/:splat"
  status = 301
  force = true

# Redirect www to apex domain
[[redirects]]
  from = "https://www.sparksciencefoundation.in/*"
  to = "https://sparksciencefoundation.in/:splat"
  status = 301
  force = true

# Security & Best-Practice Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets (images, PDFs)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
